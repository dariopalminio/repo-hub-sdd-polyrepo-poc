openapi: 3.1.0
info:
  title: repo-service API
  version: 0.1.0
  description: API contract for the repo-service proof of concept.
servers:
  - url: /
security: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report service availability
      responses:
        '200':
          description: The service can handle requests.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok
                additionalProperties: false
              example:
                status: ok